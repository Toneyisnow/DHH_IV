<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>自动航行地图 · 素材预览</title><style>*{box-sizing:border-box}body{margin:0;background:#101c24;color:#e8dec7;font:16px system-ui}main{max-width:1280px;margin:auto;padding:32px}h1{font-size:32px}h2{margin-top:40px;color:#dab979}p{color:#afbcc3;line-height:1.8}.stage{position:relative;aspect-ratio:1672/941;background:#153141;overflow:hidden}.layer{position:absolute;width:100%;height:100%;object-fit:fill}.city{position:absolute;width:11%;height:18%;object-fit:contain}.boat{position:absolute;width:7%;height:15%;object-fit:contain}.hud{position:absolute;width:15%;height:8%;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}figure{margin:0;background:repeating-conic-gradient(#25333a 0 25%,#2e3e45 0 50%) 50%/24px 24px;border:1px solid #52606a;border-radius:8px;overflow:hidden}figure img{width:100%;height:200px;object-fit:contain}figcaption{padding:9px;background:#15232d;font-size:13px}.wide{width:100%;background:#203540}button,select{background:#273b49;color:#f9e6bf;border:1px solid #b59a68;padding:9px;margin:5px;cursor:pointer}#ship{width:240px;height:240px;object-fit:contain}#flow{width:100%;max-width:720px;background:#143345}a{color:#ddbe83}</style><main><h1>自动航行地图 · 重建素材包</h1><p>按参考截图分层重绘。以下合成用于预览素材关系，具体城市位置、航线节点和锚点可在引擎中调整。</p><div class="stage"><img class="layer" src="01_map/east_asia.png"><img class="layer" src="06_routes/network_normal.svg"><img class="layer" src="06_routes/network_selected.svg"><img style="position:absolute;left:62%;top:12%;width:22%" src="07_currents/current_animated.svg"><img class="city" src="04_cities/chinese_palace.png" style="left:25%;top:20%"><img class="city" src="04_cities/chinese_walled_port.png" style="left:31%;top:47%"><img class="city" src="04_cities/chinese_pagoda_port.png" style="left:16%;top:69%"><img class="city" src="04_cities/korean_port.png" style="left:47%;top:27%"><img class="city" src="04_cities/japanese_pagoda_port.png" style="left:58%;top:38%"><img class="city" src="04_cities/japanese_castle.png" style="left:71%;top:30%"><img class="boat" src="05_ships/square/NE.png" style="left:43%;top:57%"><img class="boat" src="05_ships/lateen/SE.png" style="left:46%;top:41%"><img class="boat" src="05_ships/junk/E.png" style="left:38%;top:31%"><img class="layer" src="02_frame/frame_instruments.png"><img class="hud" src="03_ui/deck.png" style="top:0;left:20%"><img class="hud" src="03_ui/consult.png" style="top:0;left:35%"><img class="hud" src="03_ui/assign_sailors.png" style="top:0;left:50%"><img class="hud" src="03_ui/functions.png" style="top:0;left:65%"><img class="hud" src="03_ui/faction_kurushima.png" style="top:6%;left:22%"><img class="hud" src="03_ui/faction_li.png" style="top:6%;left:40%"><img class="hud" src="03_ui/go_world.png" style="top:12%;left:68%"><img class="hud" src="03_ui/date.png" style="bottom:-1%;left:1%"><img class="hud" src="03_ui/go_southeast_asia.png" style="bottom:-1%;left:42%"></div><h2>船只 · 三种帆型 × 八方向</h2><select id="type"><option value="square">方帆船</option><option value="lateen">三角帆船</option><option value="junk">中式硬帆船</option></select><span id="dirs"></span><div><img id="ship" src="05_ships/square/N.png"></div><div class="grid"><figure><img loading="lazy" src="05_ships/square/atlas.png"/><figcaption>square / 原始八方向图集</figcaption></figure><figure><img loading="lazy" src="05_ships/lateen/atlas.png"/><figcaption>lateen / 原始八方向图集</figcaption></figure><figure><img loading="lazy" src="05_ships/junk/atlas.png"/><figcaption>junk / 原始八方向图集</figcaption></figure></div><h2>洋流 · 32 帧循环 / 16 fps</h2><canvas id="flow" width="512" height="256"></canvas><button id="pause">暂停 / 播放</button><p>同时提供透明 PNG 序列、8×4 图集和可直接播放的 SVG。白色曲线沿路径流动，周期 2 秒。</p><h2>控制界面</h2><div class="grid"><figure><img loading="lazy" src="03_ui/deck.png"/><figcaption>deck</figcaption></figure><figure><img loading="lazy" src="03_ui/consult.png"/><figcaption>consult</figcaption></figure><figure><img loading="lazy" src="03_ui/assign_sailors.png"/><figcaption>assign_sailors</figcaption></figure><figure><img loading="lazy" src="03_ui/functions.png"/><figcaption>functions</figcaption></figure><figure><img loading="lazy" src="03_ui/faction_kurushima.png"/><figcaption>faction_kurushima</figcaption></figure><figure><img loading="lazy" src="03_ui/faction_li.png"/><figcaption>faction_li</figcaption></figure><figure><img loading="lazy" src="03_ui/go_world.png"/><figcaption>go_world</figcaption></figure><figure><img loading="lazy" src="03_ui/go_southeast_asia.png"/><figcaption>go_southeast_asia</figcaption></figure><figure><img loading="lazy" src="03_ui/date.png"/><figcaption>date</figcaption></figure><figure><img loading="lazy" src="03_ui/enter_port.png"/><figcaption>enter_port</figcaption></figure><figure><img loading="lazy" src="03_ui/leave_port.png"/><figcaption>leave_port</figcaption></figure><figure><img loading="lazy" src="03_ui/plaque_blank.png"/><figcaption>plaque_blank</figcaption></figure></div><h2>城市城楼</h2><div class="grid"><figure><img loading="lazy" src="04_cities/chinese_palace.png"/><figcaption>chinese_palace</figcaption></figure><figure><img loading="lazy" src="04_cities/chinese_walled_port.png"/><figcaption>chinese_walled_port</figcaption></figure><figure><img loading="lazy" src="04_cities/chinese_pagoda_port.png"/><figcaption>chinese_pagoda_port</figcaption></figure><figure><img loading="lazy" src="04_cities/korean_port.png"/><figcaption>korean_port</figcaption></figure><figure><img loading="lazy" src="04_cities/japanese_pagoda_port.png"/><figcaption>japanese_pagoda_port</figcaption></figure><figure><img loading="lazy" src="04_cities/japanese_castle.png"/><figcaption>japanese_castle</figcaption></figure></div><h2>地图和边框</h2><div class="grid"><figure><img loading="lazy" src="01_map/east_asia.png"/><figcaption>东亚地形与海深底图</figcaption></figure><figure><img loading="lazy" src="02_frame/frame_instruments.png"/><figcaption>倾斜边框与四角航海仪器</figcaption></figure></div><h2>航线与港口选中圈</h2><div class="grid"><figure><img loading="lazy" src="06_routes/route_normal.png"/><figcaption>route_normal</figcaption></figure><figure><img loading="lazy" src="06_routes/route_selected.png"/><figcaption>route_selected</figcaption></figure><figure><img loading="lazy" src="06_routes/port_selected.png"/><figcaption>port_selected</figcaption></figure></div><p><a href="界面解析与素材说明.md">界面解析与素材说明</a> · <a href="manifest.json">资源清单</a> · <a href="prompts.json">生成提示词</a></p></main><script>const dirs=['N','NE','E','SE','S','SW','W','NW'];let dir='N';function update(){document.getElementById('ship').src='05_ships/'+document.getElementById('type').value+'/'+dir+'.png'}document.getElementById('dirs').innerHTML=dirs.map(d=>'<button data-dir="'+d+'">'+d+'</button>').join('');document.getElementById('dirs').onclick=e=>{if(e.target.dataset.dir){dir=e.target.dataset.dir;update()}};document.getElementById('type').onchange=update;const sheet=new Image();sheet.src='07_currents/current_sheet.png';const ctx=document.getElementById('flow').getContext('2d');let paused=false,frame=0,last=0;document.getElementById('pause').onclick=()=>paused=!paused;function tick(t){if(sheet.complete&&sheet.naturalWidth&&t-last>=62.5){if(!paused){ctx.clearRect(0,0,512,256);ctx.drawImage(sheet,(frame%8)*512,Math.floor(frame/8)*256,512,256,0,0,512,256);frame=(frame+1)%32}last=t}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script></html>
