<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>05 自豪 · 二维绑定动画</title>
<style>body{margin:0;background:#202322;color:#f0eadc;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:25px;margin:0}p{color:#ccc8bd}video{display:block;max-width:100%;max-height:78vh;margin:auto;background:#353631}button,select{font:inherit;padding:8px 14px;background:#3b4436;color:white;border:1px solid #758465;cursor:pointer}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}a{color:#e3c58a}details{margin-top:24px}img{max-width:100%}.notice{border-left:3px solid #c6ab72;padding-left:14px}</style>
<main><h1>05 自豪 · 二维绑定样片</h1><p>3 秒 · 24 fps · 1202 × 1310。右侧仅补 1 像素满足视频编码要求，人物画稿不缩小。</p>
<video id="clip" src="05-proud-rig-v1.mp4" poster="frame-00.png" controls playsinline muted preload="auto"></video>
<div class="controls"><button id="replay">从头播放</button><button id="step">下一帧</button><select id="speed"><option value="1">正常速度</option><option value="0.5">半速检查</option><option value="0.25">四分之一速度</option></select><label><input id="repeat" type="checkbox">重复播放（结尾会跳回起点）</label></div>
<p>固定画稿驱动肩、肘、腕，手掌整体旋转和平移；衣袖随手臂变形，下摆小幅收摆。没有使用视频生成模型重绘中间帧，也没有把整幅关键图交叉淡化。</p>
<p class="notice">当前范围：从抬手中间姿态移至腰侧，结尾保持叉腰。笑容沿用目标图；尚未接入最初站姿，也未制作笑容从无到有的变化。这是绑定动作检查版，袖口边缘和接触位置仍可精修，暂未放入 Unity 正式资源。</p>
<details><summary>关键帧与检查记录</summary><img src="contact-sheet.jpg" alt="六个时间点的动画关键帧"><p><a href="rig-validation.json">固定区域逐帧检查</a> · <a href="使用说明.txt">制作说明</a> · <a href="../preview.html">静态关键姿势</a></p></details></main>
<script>const v=document.getElementById('clip');document.getElementById('replay').onclick=()=>{v.currentTime=0;v.play()};document.getElementById('step').onclick=()=>{v.pause();v.currentTime=Math.min(v.duration,v.currentTime+1/24)};document.getElementById('speed').onchange=e=>v.playbackRate=+e.target.value;document.getElementById('repeat').onchange=e=>v.loop=e.target.checked;</script></html>
