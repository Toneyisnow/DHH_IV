<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航海纪元 · 里斯本交易所</title><link rel="stylesheet" href="trade.css"></head>
<body><div class="app">
<header><div class="place"><span class="eyebrow">葡萄牙 · 里斯本</span><div class="title-row"><h1>港口交易所</h1><span class="date">1624 年 5 月 18 日 · 晴</span></div></div><div class="purse"><span>持有金币</span><strong id="gold"></strong></div></header>
<main><section class="market"><div class="heading"><h2>城市供货</h2></div><div id="marketCards" class="products"></div><div class="sale-area"><div id="saleCards" class="sale-cards" aria-label="准备卖出的商品"></div></div></section>
<section class="hold"><div class="heading"><h2>船队与产业园</h2></div><div id="ships"></div><div class="warehouse" id="warehouse"><div class="warehouse-head"><h3>⌂ 里斯本产业园仓库</h3></div><div id="warehouseSlots" class="slots"></div></div><div class="hint">点击我方空货仓选定船只或仓库 · 点击货物准备卖出 · 点击左侧待售货物放回</div></section></main>
<section class="ledger"><div class="settlement"><div class="totals"><span>买入 <b id="buyTotal">0</b></span><span>卖出 <b id="sellTotal">0</b></span><span>成交后余额 <b id="balance"></b></span></div><button id="confirm" class="confirm" disabled>确认成交</button></div></section>
<footer><span id="status" role="status" aria-live="polite">点击我方卡片选定收货船只或仓库；默认圣玛利亚号。</span><button class="text-button" id="reset">重置演示</button></footer>
</div><script src="trade.js"></script></body></html>
