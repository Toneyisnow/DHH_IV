<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B · 对话待机</title>
<style>*{box-sizing:border-box}body{margin:0;background:#202322;color:#eee8db;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1250px;margin:auto;padding:24px}h1{font-size:27px;margin:0}h2{font-size:19px}p{color:#ccc7b9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}article{padding:16px;background:#2b302b;border:1px solid #4b5446}video{width:100%;max-height:72vh;display:block;background:#171b17}button,select{font:inherit;padding:7px 12px;color:white;background:#424d3a;border:1px solid #7b8b69;cursor:pointer}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}a{color:#e3c887}img{max-width:100%}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style>
<main><h1>B · 说话与呼吸待机</h1><p>固定立绘、参数控制嘴型与表情、小幅身体浮动。5 秒循环 · 704 × 768 · 24 fps。</p>
<div class="controls"><button id="play">播放新版</button><button id="pause">暂停</button><select id="speed"><option value="1">正常速度</option><option value="0.5">半速检查</option></select></div>
<div class="grid"><article><h2>新版对话待机 · 嘴型增强</h2><video id="new" src="dialogue-idle-v2.mp4" poster="dialogue-v2-frame-000.png" controls muted loop playsinline preload="auto"></video><p>约 2.6 像素上下浮动、不到 1° 的头部微动、两次眨眼，以及带停顿的嘴型开合；嘴型控制幅度为初版的 1.7 倍。</p></article><article><h2>你提供的参考视频</h2><video src="portrait_sample-reference.mp4" controls muted playsinline preload="metadata"></video><p>动作参考取人物对话段；菜单切换和片尾不参与制作。</p></article></div>
<p>本版没有配音，嘴型是说话节奏演示，不是语音同步。手臂保持原来的姿势。面部仍由 LivePortrait 重建，局部细节可能有轻微柔化。</p>
<details><summary>关键帧与检查</summary><img src="dialogue-v2-contact.jpg" alt="说话、眨眼与头部微动关键帧"><p><a href="dialogue-v2-validation.json">逐帧验证</a> · <a href="dialogue-v2-timeline.json">动作参数时间轴</a> · <a href="使用说明.txt">制作与 Unity 使用说明</a></p></details></main>
<script>const v=document.getElementById('new');document.getElementById('play').onclick=()=>{v.currentTime=0;v.play()};document.getElementById('pause').onclick=()=>v.pause();document.getElementById('speed').onchange=e=>v.playbackRate=+e.target.value;</script></html>
